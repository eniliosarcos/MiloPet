<!--
  El escenario. `data-state` en el contenedor permite que el CSS reaccione al
  estado sin que cada hijo tenga que conocerlo.
-->
<main class="stage" [attr.data-state]="state()" [class.stage--zones]="zones()">
  <!-- La burbuja solo existe cuando hay algo que decir: nunca se ve vacía. -->
  <div class="stage__bubble">
    @if (message()) {
      <app-bubble
        [text]="message()"
        [tone]="tone()"
        [leaving]="leaving()"
        (dismiss)="closeBubble()"
      />
    }
  </div>

  <!-- La zona interactiva del personaje (ver `.hotspot` en app.scss). -->
  <div class="hotspot" data-interactive>
    <!-- El interior arrastra la ventana; el borde queda libre a propósito. -->
    <div class="hotspot__grip"></div>
  </div>

  <app-mascot class="stage__mascot" [state]="state()" [zones]="zones()" />
</main>
