<!--
  El escenario. `data-state` en el contenedor permite que el CSS reaccione al
  estado sin que cada hijo tenga que conocerlo.
-->
<main class="stage" [attr.data-state]="state()" [class.stage--zones]="zones()">
  <!-- El mundo de Milo: el borde de la ventana y su tamaño. Va primero para que
       el tinte quede detrás del personaje y no lo lave. -->
  @if (zones()) {
    <div class="stage__frame" aria-hidden="true">
      <span class="stage__frame-size">{{ frameSize }}</span>
    </div>
  }

  <!-- La burbuja solo existe cuando hay algo que decir: nunca se ve vacía. -->
  <div class="stage__bubble">
    @if (message()) {
      <app-bubble
        [text]="message()"
        [tone]="tone()"
        [leaving]="leaving()"
        (dismiss)="closeBubble()"
      />
    }
  </div>

  <!--
    La zona interactiva del personaje (ver `.hotspot` en app.scss). Todo el
    hotspot arrastra: el gesto lo resuelve `app.ts` por IPC, no el sistema
    operativo, así que ya no hay una región que se trague los eventos.
  -->
  <div
    class="hotspot"
    data-interactive
    (pointerdown)="startDrag($event)"
    (pointermove)="dragStep($event)"
    (pointerup)="stopDrag()"
    (pointercancel)="stopDrag()"
    (lostpointercapture)="stopDrag()"
  ></div>

  <app-mascot class="stage__mascot" [state]="state()" [zones]="zones()" />
</main>
