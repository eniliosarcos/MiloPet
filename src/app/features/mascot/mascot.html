<!--
  Milo entero es geometría: elipses, círculos y curvas. No hay imágenes.
  Cada grupo (`mascot__...`) es una pieza que `mascot.scss` puede mover por
  separado según el estado. `data-state` en el <svg> es el interruptor.
  El viewBox es 200x200 y todas las coordenadas viven en ese sistema.
-->
<svg
  class="mascot"
  viewBox="0 0 200 200"
  [attr.data-state]="state()"
  [attr.data-gaze]="tracking() ? 'true' : null"
  aria-hidden="true"
>
  <defs>
    <!-- Degradado del cuerpo: gris arriba a la izquierda y negro en el borde.
         El foco de luz desplazado es lo que da volumen sin sombras artificiales. -->
    <radialGradient id="miloBody" cx="36%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="52%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
  </defs>

  <!-- Sombra en el suelo: ancla al personaje y evita que "flote". -->
  <ellipse class="mascot__shadow" cx="100" cy="180" rx="42" ry="7" />
  <!-- Onda que solo aparece al escuchar. -->
  <circle class="mascot__pulse" cx="100" cy="116" r="72" />

  <g class="mascot__body">
    <!-- Torso: una elipse que respira. `transform-origin` abajo para que el
         movimiento se sienta como peso, no como flotación. El borde blanco lo
         dibuja `.mascot__torso` en `mascot.scss`. -->
    <ellipse class="mascot__torso" cx="100" cy="116" rx="62" ry="56" fill="url(#miloBody)" />

    <g class="mascot__face">
      <!-- Cada ojo es una forma blanca maciza: sin esclerótica, sin pupila y sin
           brillo. Tiene dos siluetas y el estado decide cuál se ve:
           el óvalo es el reposo, y la forma con el párpado caído hacia dentro
           solo aparece al fallar. El grupo `.mascot__eye` es el que parpadea y
           barre la mirada; `.mascot__eyes` desplaza el conjunto y, cuando el
           cursor está cerca, lo inclina hacia él (`translate` inline). -->
      <g class="mascot__eyes" [style.translate]="gazeOffset()">
        <!--
          El envoltorio existe solo para la perspectiva de la mirada: lleva el
          `transform` y deja que el ojo conserve sus animaciones. Poner la escala
          en el propio `.mascot__eye` la vuelve invisible: con una animación de
          `transform` en el mismo elemento, el navegador pinta el ojo sin ella.
        -->
        <g class="mascot__eye mascot__eye--left">
          <g class="mascot__eye-scaler" [style.transform]="eyeScale().left">
            <ellipse
              class="mascot__eye-shape mascot__eye-shape--calm"
              cx="80"
              cy="108"
              rx="16.5"
              ry="18"
            />
            <path
              class="mascot__eye-shape mascot__eye-shape--glare"
              d="M62 95 C73 90 89 94 98 102 C94 120 79 126 69 119 C61 113 58 103 62 95 Z"
            />
          </g>
        </g>
        <g class="mascot__eye mascot__eye--right">
          <g class="mascot__eye-scaler" [style.transform]="eyeScale().right">
            <ellipse
              class="mascot__eye-shape mascot__eye-shape--calm"
              cx="120"
              cy="108"
              rx="16.5"
              ry="18"
            />
            <path
              class="mascot__eye-shape mascot__eye-shape--glare"
              d="M138 95 C127 90 111 94 102 102 C106 120 121 126 131 119 C139 113 142 103 138 95 Z"
            />
          </g>
        </g>
      </g>

      <!-- Boca: oculta por defecto. Solo aparece al actuar (sonrisa) y al
           fallar (ceño, la misma curva invertida). -->
      <path class="mascot__mouth" d="M90 142 Q100 152 110 142" />
    </g>
  </g>

  <!-- Overlay de depuración (`?zones=1`). Los radios vienen de `gaze.ts`, así
       que el círculo verde es exactamente donde la mirada se satura y el
       amarillo donde se suelta. -->
  @if (zones()) {
    <g class="mascot__zones">
      <circle
        class="mascot__zone mascot__zone--range"
        cx="100"
        [attr.cy]="gazeZones.centerY"
        [attr.r]="gazeZones.range"
      />
      <circle
        class="mascot__zone mascot__zone--reach"
        cx="100"
        [attr.cy]="gazeZones.centerY"
        [attr.r]="gazeZones.reach"
      />
      <circle class="mascot__zone-center" cx="100" [attr.cy]="gazeZones.centerY" r="2" />
    </g>
  }
</svg>
