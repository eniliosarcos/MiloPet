<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MiloPet</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
    Todo lo que carga Milo es local y viaja con la app. 'unsafe-inline' hace
    falta para los estilos porque Angular inyecta el CSS de cada componente en
    tiempo de ejecución; los scripts no tienen esa excepción.
    Nota: en el build de producción `baseHref` pasa a "./" (ver angular.json),
    porque bajo file:// una barra inicial apunta a la raíz del disco.
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'self' file: ws://localhost:4200 http://localhost:4200"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Angular reemplaza este elemento por el componente App. -->
    <app-root></app-root>
  </body>
</html>
