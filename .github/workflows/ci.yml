name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # El binario de Electron (~100 MB) no hace falta para lint, tests ni build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Husky solo tiene sentido en una máquina de desarrollo.
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Historial
        run: npm run history:check

      - name: Tests
        run: npm run test:ci

      - name: Build
        run: npm run build
